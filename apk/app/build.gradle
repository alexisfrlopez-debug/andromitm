plugins {
    id 'com.android.application'
}

// Signature release : keystore dans le dossier tokens (hors git).
// À défaut, retombe sur la signature debug (installable aussi).
def ksFile = file("../../../tokens/andromitm.keystore")
def ksPass = ""
def ksPassFile = file("../../../tokens/keystore_pass.txt")
if (ksPassFile.exists()) ksPass = ksPassFile.text.trim()

android {
    namespace 'io.andromitm.app'
    compileSdk 34

    defaultConfig {
        applicationId "io.andromitm.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.2.0"
        ndk {
            // Moteur bettercap embarqué : build Android officiel 32-bit (v2.25).
            // Les appareils 64-bits-only utilisent le « chemin moteur custom » dans les réglages.
            abiFilters 'armeabi-v7a'
        }
    }

    if (ksFile.exists() && ksPass) {
        signingConfigs {
            release {
                storeFile ksFile
                storePassword ksPass
                keyAlias 'andromitm'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists() && ksPass) {
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        jniLibs {
            // indispensable : extraction des binaires sur le disque pour exec()
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
